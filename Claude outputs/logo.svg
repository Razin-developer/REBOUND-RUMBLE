<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#2a1750"/><stop offset="1" stop-color="#0c0719"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#e07a10"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6f1ff"/><stop offset=".5" stop-color="#5fb4ff"/><stop offset="1" stop-color="#2447d6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <!-- bounce trails -->
  <path d="M70 380 L190 250 L256 330 L330 170 L450 120" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
  <!-- gold ring (host) -->
  <g filter="url(#glow)" transform="translate(205 235) rotate(-18)">
    <ellipse rx="112" ry="112" fill="none" stroke="url(#gold)" stroke-width="30"/>
    <ellipse rx="112" ry="112" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" transform="translate(-6 -6) scale(.96)"/>
  </g>
  <!-- blue ring (guest) -->
  <g filter="url(#glow)" transform="translate(320 270) rotate(14)">
    <ellipse rx="112" ry="112" fill="none" stroke="url(#blue)" stroke-width="30"/>
    <ellipse rx="112" ry="112" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="5" transform="translate(-6 -6) scale(.96)"/>
  </g>
  <!-- the two rings interlock: redraw the gold arc over the blue where they cross -->
  <g transform="translate(205 235) rotate(-18)"><path d="M70 -88 A112 112 0 0 1 112 0" fill="none" stroke="url(#gold)" stroke-width="30"/></g>
  <!-- spark -->
  <path d="M256 60 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff" opacity=".9"/>
  <text x="256" y="452" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="58" letter-spacing="3" fill="#ffd45a" stroke="#0c0719" stroke-width="6" paint-order="stroke">REBOUND</text>
  <text x="256" y="494" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="34" letter-spacing="14" fill="#8fd0ff" stroke="#0c0719" stroke-width="5" paint-order="stroke">RUMBLE</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
